name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [staging, main]
  # Manual runs, e.g. to prove the drift check on a throwaway branch.
  workflow_dispatch:

jobs:
  checks:
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    services:
      postgres:
        # Same major as compose.yaml.
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: war_weeker
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d war_weeker"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/war_weeker?sslmode=disable
      DATABASE_DRIVER: pg
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm typecheck

      # Validates that the committed migrations apply cleanly to a fresh
      # database, before anything else touches it.
      - run: pnpm db:migrate

      # Migration drift: generating from the schema must add nothing, so
      # every schema change ships with its migration.
      - name: Migration drift check
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain drizzle)" ]; then
            git status --porcelain drizzle
            echo "::error::src/db/schema.ts has changes with no migration. Run pnpm db:generate and commit drizzle/."
            exit 1
          fi

      - run: pnpm test

      # Catches production-compile-only failures that lint, typecheck and
      # dev mode can't see.
      - run: pnpm build

      # End-to-end over the production build against the Postgres service:
      # migrations, every seed (reset, then idempotent), pages, actions and
      # /api/mcp. Smoke signs its own sessions, so no real auth secrets.
      - run: pnpm smoke

      # The Playwright flows (sign-in, Points Entry, Bracket, Heats Bracket
      # with the End War Week warning, Finale, Archive, forms, theme) in
      # Chromium over the same build and Postgres service.
      # e2e runs only on PRs into main (staging -> main, before production):
      # a PR into staging and a push to staging or main run only the checks
      # above. A browser regression on staging fails the next staging -> main
      # PR, so fix it there before shipping.
      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: pnpm exec playwright install --with-deps chromium

      - if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: pnpm e2e

      - if: failure() && (github.event_name == 'pull_request' && github.base_ref == 'main')
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results
          path: test-results/e2e
          retention-days: 7
